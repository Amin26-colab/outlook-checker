<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outlook Fast Inbox</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d1117; color: #c9d1d9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { width: 100%; max-width: 800px; background: #161b22; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); border: 1px solid #30363d; }
        h2 { text-align: center; color: #58a6ff; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; color: #8b949e; font-size: 14px; }
        input[type="text"], input[type="password"] { width: 100%; padding: 12px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #fff; font-size: 15px; outline: none; }
        input:focus { border-color: #58a6ff; }
        button { width: 100%; padding: 12px; background-color: #238636; color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        button:hover { background-color: #2ea043; }
        button:disabled { background-color: #484f58; cursor: not-allowed; }
        .otp-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 25px; }
        .otp-box { background: #21262d; padding: 15px; border-radius: 8px; text-align: center; border: 1px solid #30363d; }
        .otp-box h4 { color: #8b949e; font-size: 13px; margin-bottom: 8px; text-transform: uppercase; }
        .otp-code { font-size: 20px; font-weight: bold; color: #58a6ff; margin-bottom: 8px; word-break: break-all; }
        .otp-link-btn { display: inline-block; font-size: 12px; color: #fff; background: #1f6beb; text-decoration: none; padding: 6px 12px; border-radius: 4px; font-weight: 600; margin-top: 5px; word-break: break-all; }
        .otp-link-btn:hover { background: #388bfd; }
        .email-list { margin-top: 25px; }
        .email-item { background: #21262d; padding: 12px 15px; border-radius: 6px; margin-bottom: 10px; border-left: 4px solid #58a6ff; cursor: pointer; transition: 0.2s; }
        .email-item:hover { background: #30363d; }
        .email-header { display: flex; justify-content: space-between; font-size: 13px; color: #8b949e; margin-bottom: 5px; }
        .email-sender { font-weight: bold; color: #f0f6fc; }
        .email-subject { font-size: 14px; font-weight: 600; color: #c9d1d9; margin-bottom: 4px; }
        .email-preview { font-size: 13px; color: #8b949e; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .error-msg { background: rgba(248, 81, 73, 0.15); color: #f85149; padding: 12px; border-radius: 6px; border: 1px solid #f85149; margin-top: 20px; text-align: center; display: none; }
        .loader { display: none; text-align: center; margin-top: 15px; color: #58a6ff; }
        
        /* Modal Styles */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-body-content { background: #161b22; width: 90%; max-width: 650px; max-height: 80vh; border-radius: 10px; padding: 20px; border: 1px solid #30363d; overflow-y: auto; color: #c9d1d9; position: relative; }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 20px; cursor: pointer; color: #8b949e; }
        .close-btn:hover { color: #fff; }
    </style>
</head>
<body>

<div class="container">
    <h2>Outlook Fast Inbox Check</h2>
    
    <form id="fetchForm">
        <div class="form-group">
            <label>Email Address</label>
            <input type="text" id="email" required placeholder="example@outlook.com">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" required placeholder="••••••••">
        </div>
        <button type="submit" id="submitBtn">Fetch Inbox & Extract OTP</button>
    </form>

    <div class="loader" id="loader">ওয়েট করুন, ইনবক্স লোড হচ্ছে...</div>
    <div class="error-msg" id="errorBox"></div>

    <div class="otp-container" id="otpBoxContainer" style="display: none;">
        <div class="otp-box">
            <h4>LINKEDIN</h4>
            <div class="otp-code" id="linkedinCode">None</div>
            <div id="linkedinLink"></div>
        </div>
        <div class="otp-box">
            <h4>FACEBOOK</h4>
            <div class="otp-code" id="facebookCode">None</div>
            <div id="facebookLink"></div>
        </div>
        <div class="otp-box">
            <h4>INSTAGRAM</h4>
            <div class="otp-code" id="instagramCode">None</div>
            <div id="instagramLink"></div>
        </div>
    </div>

    <div class="email-list" id="emailList"></div>
</div>

<!-- Email Full Content Modal -->
<div class="modal-overlay" id="emailModal">
    <div class="modal-body-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h3 id="modalSubject" style="color: #58a6ff; margin-bottom: 10px;"></h3>
        <p id="modalSender" style="font-size: 13px; color: #8b949e; margin-bottom: 15px;"></p>
        <hr style="border-color: #30363d; margin-bottom: 15px;">
        <div id="modalBody" style="white-space: pre-wrap; font-size: 14px; line-height: 1.6;"></div>
    </div>
</div>

<script>
function escapeHtml(text) {
    if (!text) return '';
    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

let loadedEmails = [];

document.getElementById('fetchForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const submitBtn = document.getElementById('submitBtn');
    const loader = document.getElementById('loader');
    const errorBox = document.getElementById('errorBox');
    const emailList = document.getElementById('emailList');
    const otpBoxContainer = document.getElementById('otpBoxContainer');

    errorBox.style.display = 'none';
    emailList.innerHTML = '';
    otpBoxContainer.style.display = 'none';
    submitBtn.disabled = true;
    loader.style.display = 'block';

    const formData = new FormData();
    formData.append('email', email);
    formData.append('password', password);

    try {
        const response = await fetch('/fetch-inbox', {
            method: 'POST',
            body: formData
        });

        const data = await response.json();

        if (data.success) {
            if (data.otps) {
                otpBoxContainer.style.display = 'grid';
                
                ['linkedin', 'facebook', 'instagram'].forEach(platform => {
                    const otpData = data.otps[platform];
                    const codeElem = document.getElementById(`${platform}Code`);
                    const linkElem = document.getElementById(`${platform}Link`);

                    codeElem.innerText = otpData.code || 'None';
                    if (otpData.link) {
                        linkElem.innerHTML = `<a href="${escapeHtml(otpData.link)}" target="_blank" class="otp-link-btn">Open Link</a>`;
                    } else {
                        linkElem.innerHTML = '<span style="font-size:12px; color:#484f58;">No Link</span>';
                    }
                });
            }

            if (data.emails && data.emails.length > 0) {
                loadedEmails = data.emails;
                let html = '';
                data.emails.forEach((item, index) => {
                    html += `
                        <div class="email-item" onclick="openModal(${index})">
                            <div class="email-header">
                                <span class="email-sender">${escapeHtml(item.sender)}</span>
                                <span>${escapeHtml(item.date)}</span>
                            </div>
                            <div class="email-subject">${escapeHtml(item.subject)}</div>
                            <div class="email-preview">${escapeHtml(item.preview)}</div>
                        </div>
                    `;
                });
                emailList.innerHTML = html;
            }
        } else {
            errorBox.innerText = data.error || 'একটি ত্রুটি ঘটেছে।';
            errorBox.style.display = 'block';
        }

    } catch (err) {
        errorBox.innerText = 'সার্ভারের সাথে সংযোগ বিচ্ছিন্ন হয়েছে: ' + err.message;
        errorBox.style.display = 'block';
    } finally {
        submitBtn.disabled = false;
        loader.style.display = 'none';
    }
});

function openModal(index) {
    const email = loadedEmails[index];
    if(email) {
        document.getElementById('modalSubject').innerText = email.subject;
        document.getElementById('modalSender').innerText = "From: " + email.sender + " (" + email.date + ")";
        document.getElementById('modalBody').innerText = email.preview;
        document.getElementById('emailModal').style.display = 'flex';
    }
}

function closeModal() {
    document.getElementById('emailModal').style.display = 'none';
}
</script>

</body>
</html>
