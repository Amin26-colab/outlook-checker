<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outlook Fast Inbox</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0b1120; color: #f1f5f9; margin: 0; padding: 20px 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .main-card { background: #151e32; border: 1px solid #23304d; border-radius: 12px; width: 100%; max-width: 680px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { color: #38bdf8; text-align: center; margin-top: 0; margin-bottom: 20px; font-weight: 600; font-size: 22px; }
        
        .form-group { margin-bottom: 15px; }
        label { font-size: 13px; color: #94a3b8; display: block; margin-bottom: 6px; font-weight: 500; }
        input[type="text"], input[type="password"] { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #283654; border-radius: 8px; font-size: 14px; color: #ffffff; outline: none; transition: 0.2s; }
        input:focus { border-color: #38bdf8; box-shadow: 0 0 8px rgba(56, 189, 248, 0.2); }
        button { width: 100%; background: #0284c7; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 5px; }
        button:hover { background: #0369a1; }
        button:disabled { background: #334155; cursor: not-allowed; opacity: 0.7; }
        
        /* OTP Dashboard Section */
        .otp-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
        .otp-card { background: #0f172a; border: 1px solid #23304d; border-radius: 8px; padding: 12px; text-align: center; position: relative; }
        .otp-card .title { font-size: 12px; font-weight: 600; color: #94a3b8; margin-bottom: 6px; text-transform: uppercase; }
        .otp-card .code-box { font-size: 18px; font-weight: bold; color: #38bdf8; background: #1e293b; padding: 6px; border-radius: 6px; cursor: pointer; letter-spacing: 1px; user-select: all; }
        .otp-card .code-box:hover { background: #334155; }
        .otp-card .link-btn { display: block; margin-top: 8px; font-size: 11px; color: #38bdf8; text-decoration: none; word-break: break-all; background: rgba(56, 189, 248, 0.1); padding: 4px; border-radius: 4px; border: 1px dashed #0284c7; cursor: pointer; }

        /* Error Box */
        .error-message { color: #f87171; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); padding: 12px; border-radius: 8px; margin-top: 15px; text-align: center; font-size: 13px; display: none; }

        /* Inbox List Container */
        .inbox-wrapper { margin-top: 25px; display: none; }
        .inbox-header { font-size: 15px; font-weight: 600; color: #e2e8f0; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .inbox-list { max-height: 400px; overflow-y: auto; padding-right: 5px; }
        .inbox-list::-webkit-scrollbar { width: 6px; }
        .inbox-list::-webkit-scrollbar-track { background: #0f172a; }
        .inbox-list::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

        .email-card { background: #131c31; border: 1px solid #212e4a; border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; cursor: pointer; transition: 0.15s; }
        .email-card:hover { border-color: #38bdf8; }
        .email-subject { font-size: 14px; font-weight: 600; color: #f8fafc; margin-bottom: 3px; }
        .email-sender { font-size: 12px; color: #94a3b8; margin-bottom: 6px; }
        .email-preview { font-size: 12px; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Modal Popup for Full Email */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); z-index: 1000; justify-content: center; align-items: center; padding: 15px; }
        .modal-content { background: #151e32; border: 1px solid #23304d; border-radius: 12px; width: 100%; max-width: 600px; padding: 20px; max-height: 85vh; overflow-y: auto; position: relative; }
        .modal-close { position: absolute; top: 12px; right: 15px; font-size: 22px; color: #94a3b8; cursor: pointer; }
        .modal-subject { font-size: 16px; font-weight: bold; color: #f8fafc; margin-bottom: 8px; padding-right: 25px; }
        .modal-sender { font-size: 12px; color: #38bdf8; margin-bottom: 15px; border-bottom: 1px solid #23304d; padding-bottom: 10px; }
        .modal-body { font-size: 13px; color: #cbd5e1; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
    </style>
</head>
<body>

<div class="main-card">
    <h2>Outlook Fast Inbox</h2>
    
    <form id="checkerForm">
        <div class="form-group">
            <label>Email Address</label>
            <input type="text" id="email" name="email" placeholder="example@outlook.com" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit" id="submitBtn">Fetch Inbox & Extract OTP</button>
    </form>

    <!-- OTP Section -->
    <div class="otp-container">
        <div class="otp-card">
            <div class="title">LinkedIn</div>
            <div class="code-box" id="linkedinOtp" onclick="copyText(this)">None</div>
            <div class="link-btn" id="linkedinLink" onclick="copyText(this)">No Link</div>
        </div>
        <div class="otp-card">
            <div class="title">Facebook</div>
            <div class="code-box" id="facebookOtp" onclick="copyText(this)">None</div>
            <div class="link-btn" id="facebookLink" onclick="copyText(this)">No Link</div>
        </div>
        <div class="otp-card">
            <div class="title">Instagram</div>
            <div class="code-box" id="instagramOtp" onclick="copyText(this)">None</div>
            <div class="link-btn" id="instagramLink" onclick="copyText(this)">No Link</div>
        </div>
    </div>

    <div id="errorMessage" class="error-message"></div>

    <!-- Inbox List -->
    <div id="inboxWrapper" class="inbox-wrapper">
        <div class="inbox-header">
            <span>Inbox Messages</span>
            <span id="mailCount" style="font-size: 12px; color: #94a3b8;"></span>
        </div>
        <div id="inboxList" class="inbox-list"></div>
    </div>
</div>

<!-- Email View Modal -->
<div id="mailModal" class="modal-overlay">
    <div class="modal-content">
        <span class="modal-close" id="modalClose">&times;</span>
        <div class="modal-subject" id="mSubject"></div>
        <div class="modal-sender" id="mSender"></div>
        <div class="modal-body" id="mBody"></div>
    </div>
</div>

<script>
    function escapeHtml(text) {
    if (!text) return '';
    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}
    document.getElementById("checkerForm").addEventListener("submit", async function(e) {
        e.preventDefault();
        
        const submitBtn = document.getElementById("submitBtn");
        const errorMessage = document.getElementById("errorMessage");
        const inboxWrapper = document.getElementById("inboxWrapper");
        const inboxList = document.getElementById("inboxList");

        submitBtn.disabled = true;
        submitBtn.innerText = "Processing...";
        errorMessage.style.display = "none";
        inboxWrapper.style.display = "none";
        inboxList.innerHTML = "";

        const formData = new FormData(e.target);

        try {
            const response = await fetch("/fetch-inbox", { method: "POST", body: formData });
            const data = await response.json();

            if (data.success) {
                // Update OTPs
                document.getElementById("linkedinOtp").innerText = data.otps.linkedin.code || "None";
                document.getElementById("linkedinLink").innerText = data.otps.linkedin.link ? "Copy Link" : "No Link";
                document.getElementById("linkedinLink").setAttribute("data-link", data.otps.linkedin.link || "");

                document.getElementById("facebookOtp").innerText = data.otps.facebook.code || "None";
                document.getElementById("facebookLink").innerText = data.otps.facebook.link ? "Copy Link" : "No Link";
                document.getElementById("facebookLink").setAttribute("data-link", data.otps.facebook.link || "");

                document.getElementById("instagramOtp").innerText = data.otps.instagram.code || "None";
                document.getElementById("instagramLink").innerText = data.otps.instagram.link ? "Copy Link" : "No Link";
                document.getElementById("instagramLink").setAttribute("data-link", data.otps.instagram.link || "");

                // Render Emails
                document.getElementById("mailCount").innerText = `Total: ${data.emails.length}`;
                data.emails.forEach(email => {
                    const card = document.createElement("div");
                    card.className = "email-card";
                    card.innerHTML = `
                        <div class="email-subject">${escapeHtml(email.subject)}</div>
                        <div class="email-sender">${escapeHtml(email.sender)}</div>
                        <div class="email-preview">${escapeHtml(email.preview)}</div>
                    `;
                    card.addEventListener("click", () => {
                        document.getElementById("mSubject").innerText = email.subject;
                        document.getElementById("mSender").innerText = `From: ${email.sender}`;
                        document.getElementById("mBody").innerText = email.full_body || email.preview;
                        document.getElementById("mailModal").style.display = "flex";
                    });
                    inboxList.appendChild(card);
                });
                inboxWrapper.style.display = "block";
            } else {
                throw new Error(data.error || "Failed to load.");
            }
        } catch (err) {
            errorMessage.innerText = err.message;
            errorMessage.style.display = "block";
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = "Fetch Inbox & Extract OTP";
        }
    });

    function copyText(elem) {
        const link = elem.getAttribute("data-link");
        const val = link !== null ? link : elem.innerText;
        if(val && val !== "None" && val !== "No Link") {
            navigator.clipboard.writeText(val);
            alert("Copied: " + val);
        }
    }

    document.getElementById("modalClose").onclick = () => document.getElementById("mailModal").style.display = "none";
</script>

</body>
</html>
