<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outlook Inbox Checker</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f8; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 40px auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #0078d4; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #0078d4; color: #fff; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:disabled { background-color: #a6a6a6; }
        #loader { text-align: center; display: none; margin-top: 15px; color: #0078d4; font-weight: bold; }
        .inbox-list { margin-top: 25px; }
        .email-item { border-bottom: 1px solid #eee; padding: 12px 0; }
        .email-item:last-child { border-bottom: none; }
        .sender { font-weight: bold; color: #333; }
        .subject { color: #0078d4; margin: 3px 0; }
        .preview { font-size: 13px; color: #666; }
        .error { color: red; text-align: center; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Outlook Fast Inbox</h2>
    <form id="loginForm">
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" required placeholder="example@outlook.com">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" required placeholder="Password">
        </div>
        <button type="submit" id="submitBtn">Check Inbox</button>
    </form>

    <div id="loader">ব্যাকএন্ডে লগইন সম্পন্ন করে ইনবক্স লোড করা হচ্ছে... (অনুগ্রহ করে অপেক্ষা করুন)</div>
    <div id="errorMsg" class="error"></div>
    <div class="inbox-list" id="inboxContainer"></div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const submitBtn = document.getElementById('submitBtn');
        const loader = document.getElementById('loader');
        const errorMsg = document.getElementById('errorMsg');
        const inboxContainer = document.getElementById('inboxContainer');

        submitBtn.disabled = true;
        loader.style.display = 'block';
        errorMsg.innerText = '';
        inboxContainer.innerHTML = '';

        const formData = new FormData();
        formData.append('email', email);
        formData.append('password', password);

        try {
            const response = await fetch('/fetch-inbox', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            if (data.success) {
                if (data.emails.length === 0) {
                    inboxContainer.innerHTML = '<p style="text-align:center;">কোনো ইমেইল পাওয়া যায়নি।</p>';
                } else {
                    data.emails.forEach(email => {
                        const div = document.createElement('div');
                        div.className = 'email-item';
                        div.innerHTML = `
                            <div class="sender">${email.sender}</div>
                            <div class="subject">${email.subject}</div>
                            <div class="preview">${email.preview}</div>
                        `;
                        inboxContainer.appendChild(div);
                    });
                }
            } else {
                errorMsg.innerText = 'ইনবক্স লোড করতে ব্যর্থ হয়েছে। ইমেইল বা পাসওয়ার্ড পুনরায় চেক করুন।';
            }
        } catch (err) {
            errorMsg.innerText = 'সার্ভারে সংযোগ করতে সমস্যা হয়েছে।';
        } finally {
            submitBtn.disabled = false;
            loader.style.display = 'none';
        }
    });
</script>

</body>
</html>
